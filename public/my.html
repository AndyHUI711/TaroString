<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的球拍 · 穿線台</title>
  <meta name="theme-color" content="#f7f5f1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/logo.jpg" alt="芋圓穿線 TARO STRINGING" width="56" height="56" />
    </a>
    <nav>
      <a href="/catalog" data-i18n="nav.catalog">球線目錄</a>
      <a href="/local" data-i18n="nav.local">本機球拍</a>
      <a href="#" id="logout-link" data-i18n="nav.logout">登出</a>
      <span id="lang-switch"></span>
    </nav>
  </div>

  <main class="wrap">
    <h1 data-i18n="my.title">我的球拍</h1>
    <p class="lead" id="my-lead" data-i18n="my.leadLoading">正在讀取…</p>

    <div id="loading" class="empty">…</div>

    <div id="error-box" class="card" hidden>
      <h2 data-i18n="my.errorTitle">暫時讀不到你的球拍</h2>
      <p class="hint" id="error-text" data-i18n="my.errorBody">請稍後重試。</p>
    </div>

    <div id="total-card" class="card" hidden>
      <dl class="kv">
        <dt data-i18n="my.statCount">球拍數量</dt><dd id="stat-count">0</dd>
        <dt data-i18n="my.statHours">累積使用</dt><dd id="stat-hours">0</dd>
        <dt data-i18n="my.statLogs">記錄條數</dt><dd id="stat-logs">0</dd>
      </dl>
    </div>

    <section class="card" id="list-card" hidden>
      <h2 data-i18n="my.listTitle">已認領的球拍</h2>
      <div class="list" id="list"></div>
    </section>

    <div id="empty-box" class="card" hidden>
      <h2 data-i18n="my.emptyTitle">還沒有認領任何球拍</h2>
      <p class="hint" data-i18n="my.emptyBody">打開穿線師給你的連結，按「認領這支球拍」。</p>
      <a class="btn ghost" href="/local" style="margin-top:12px" data-i18n="my.localBtn">看看本機掃過的球拍</a>
    </div>
  </main>

  <footer class="site-foot">
    <div>Licensed © 2026 by Andy</div>
    <div>Tel: <a href="tel:+85265586847">+852 65586847</a></div>
  </footer>


  <script src="/i18n.js"></script>
  <script src="/navigation.js"></script>
  <script src="/client.js"></script>
  <script>
    // i18n 兜底：i18n.js 沒載入（快取 / 部署不同步）時，t 與格式化函式會 undefined，
    // 之前 load() 會在 t('my.lead') 那行拋錯，讓頁面永遠卡在「正在讀取…」。
    // 這裡全部包一層安全呼叫，並用 try/catch 保證 loading 一定會收起來。
    const tt = (key, vars) => (typeof window.t === 'function' ? window.t(key, vars) : key);
    const fmtHoursSafe = (v) => (typeof window.fmtHours === 'function' ? window.fmtHours(v) : `${Number(v) || 0} 小時`);
    const fmtDateSafe = (v) => (typeof window.fmtDateShort === 'function' ? window.fmtDateShort(v) : (v ? String(v).slice(0, 10) : '—'));
    const lineSafe = (line) => {
      if (typeof window.lineText === 'function') return window.lineText(line);
      const name = [line.brand, line.model].filter(Boolean).join(' ');
      return [name, line.tension != null ? `${line.tension} 磅` : ''].filter(Boolean).join(' · ') || '—';
    };
    const escSafe = (s) => (typeof window.escapeHtml === 'function'
      ? window.escapeHtml(s)
      : String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));

    async function load() {
      const loading = document.getElementById('loading');
      try {
        const res = await api('/api/my');

        if (res.status === 401) {
          location.href = '/login?next=/my';
          return;
        }

        loading.hidden = true;

        if (!res.ok) {
          document.getElementById('error-box').hidden = false;
          document.getElementById('error-text').textContent =
            (typeof window.errText === 'function') ? window.errText(res.data) : ((res.data && res.data.error) || '請稍後重試。');
          return;
        }

        const rackets = res.data.rackets || [];
        document.getElementById('my-lead').textContent =
          (typeof window.t === 'function')
            ? window.t('my.lead', { email: res.data.email })
            : `目前登入：${res.data.email || ''}`;

        const totalHours = rackets.reduce((sum, r) => sum + Number(r.total_hours || 0), 0);
        const totalLogs = rackets.reduce((sum, r) => sum + Number(r.log_count || 0), 0);

        document.getElementById('total-card').hidden = false;
        document.getElementById('stat-count').textContent =
          (typeof window.t === 'function') ? window.t('my.unitCount', { n: rackets.length }) : `${rackets.length} 支`;
        document.getElementById('stat-hours').textContent = fmtHoursSafe(totalHours);
        document.getElementById('stat-logs').textContent = String(totalLogs);

        if (!rackets.length) {
          document.getElementById('empty-box').hidden = false;
          return;
        }

        document.getElementById('list-card').hidden = false;
        document.getElementById('list').innerHTML = rackets.map((r) => {
          const title = [r.racket_brand, r.racket_model].filter(Boolean).join(' ');
          const stringText = r.cross_model
            ? tt('meta.mainCross', {
                main: lineSafe({ brand: r.main_brand, model: r.main_model, tension: r.main_tension }),
                cross: lineSafe({ brand: r.cross_brand, model: r.cross_model, tension: r.cross_tension }),
              })
            : lineSafe({ brand: r.main_brand, model: r.main_model, tension: r.main_tension });
          const meta = `${stringText} · ${tt('unit.logs', { n: r.log_count })} · ${fmtDateSafe(r.strung_at)}`;

          return `
            <a class="item" href="/r/${r.uuid}">
              <div class="item-title">
                <strong>${escSafe(title)}</strong>
                <span class="item-side">${fmtHoursSafe(r.total_hours)}</span>
              </div>
              <div class="item-meta">${escSafe(meta)}</div>
            </a>`;
        }).join('');
      } catch (error) {
        loading.hidden = true;
        document.getElementById('error-box').hidden = false;
        document.getElementById('error-text').textContent = '網路異常，請稍後重試';
      }
    }

    document.getElementById('logout-link').addEventListener('click', async (event) => {
      event.preventDefault();
      try {
        await api('/api/auth/logout', { method: 'POST', body: '{}' });
      } catch (error) {
        /* 登出失敗也要回登入頁 */
      }
      location.href = '/login?next=/my';
    });

    load();
  </script>
</body>
</html>
